<!DOCTYPE html>
<html lang="en" data-requires-auth>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Continuum Academy - Search</title>

  <!-- Shared app shell (cards, carousel, modal, bottom nav) -->
  <link rel="stylesheet" href="../assets/css/pages/home.css">
  <!-- Search page: field, result rows, results grid -->
  <link rel="stylesheet" href="../assets/css/pages/search.css">
  <!-- Installable on the home screen -->
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/icon-192.png">

  <!-- Session guard: signed-out visitors are redirected before first paint -->
  <script src="../assets/js/core/mobile.js"></script>
  <script src="../assets/js/core/config.js"></script>
  <script src="../assets/js/core/auth.js"></script>
</head>

<body>
  <!-- Toast feedback notification -->
  <div class="toast-msg" id="pageToast" role="status"></div>

  <div class="app-container">

    <!-- Search header replaces the top bar on this page -->
    <header class="search-header">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>

        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="Search Discipline"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search disciplines and videos">

        <button class="mic-btn" id="micBtn" aria-label="Search by voice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
          </svg>
        </button>
      </div>
    </header>

    <main class="main-content search-main">

      <!-- Empty state: what to watch next -->
      <section class="search-block" id="recommendedBlock">
        <h2 class="block-title">Recommended Discipline</h2>
        <div class="result-list" id="resultList"></div>
      </section>

      <!-- Typed state: matching titles -->
      <section class="search-block" id="resultsBlock" hidden>
        <h2 class="block-title sr-only" id="resultsTitle">Results</h2>
        <div class="search-grid" id="resultsGrid"></div>
        <p class="empty-state" id="emptyState" hidden></p>
      </section>

      <noscript>
        <p class="empty-state">Enable JavaScript to search the library.</p>
      </noscript>

      <!-- Video Player Modal Overlay -->
      <div class="video-modal" id="videoModal" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="video-modal-backdrop" id="videoModalBackdrop"></div>
        <div class="video-modal-sheet">
          <div class="video-modal-header">
            <div class="video-modal-text">
              <span class="video-modal-tag">CONTINUUM STREAM</span>
              <h3 class="video-modal-title" id="videoModalTitle">Video Title</h3>
              <p class="video-modal-sub" id="videoModalSpeaker">Speaker</p>
            </div>
            <button class="video-modal-close" id="closeVideoBtn" aria-label="Close video player">✕</button>
          </div>

          <div class="video-frame-wrap">
            <video id="mainVideoPlayer" playsinline controls preload="metadata" poster="">
              <source id="videoSource" src="">
              Your browser does not support the video tag.
            </video>
            <div class="video-sample-fallback" id="videoFallbackPrompt">
              <div class="fallback-icon">🎬</div>
              <h4>Executive Video Ready</h4>
              <p>Place your video file in <code>assets/videos/</code> or stream online.</p>
              <button class="btn-sample-play" id="playTrailerClipBtn">Watch Vertical Trailer Clip</button>
            </div>
          </div>

          <div class="video-modal-controls">
            <button class="modal-btn" id="modalLikeAction">♥ Like</button>
            <button class="modal-btn" id="modalListAction">＋ My List</button>
            <button class="modal-btn" id="modalShareAction">↗ Share</button>
          </div>
        </div>
      </div>

    </main>

    <!-- Floating Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav-container" aria-label="Mobile Navigation">
      <div class="floating-nav">

        <!-- Home -->
        <button class="nav-tab" data-tab="home" data-href="../home/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">Home</span>
        </button>

        <!-- Disciplines -->
        <button class="nav-tab" data-tab="disciplines" data-href="../disciplines/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </div>
          <span class="nav-label">Disciplines</span>
        </button>

        <!-- Search (Active) -->
        <button class="nav-tab active" data-tab="search" aria-current="page">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <span class="nav-label">Search</span>
        </button>

        <!-- My Library -->
        <button class="nav-tab" data-tab="library" data-href="../library/">
          <div class="nav-icon-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <line x1="8" y1="7" x2="16" y2="7"></line>
              <line x1="8" y1="11" x2="14" y2="11"></line>
            </svg>
          </div>
          <span class="nav-label">My Library</span>
        </button>

      </div>
    </nav>

  </div>

  <!-- Library data, the page behaviour, then the shared player modal -->
  <script src="../assets/js/data/disciplines.js"></script>
  <script src="../assets/js/core/content.js"></script>
  <script src="../assets/js/data/catalogue.js"></script>
  <script src="../assets/js/pages/search.js"></script>
  <script src="../assets/js/core/store.js"></script>
  <script src="../assets/js/core/player.js"></script>
</body>
</html>
